```html
<button onclick="orderFish('Arowana',1800)">Order Now</button>

<script>
function orderFish(fishName, price) {

    let customer = prompt("Enter your Name:");
    if (!customer) return;

    let quantity = prompt("Enter Quantity:");
    if (!quantity) return;

    let phone = "917036010302";

    let message =
`🐠 *KK AQUARIUM FISH ORDER*

👤 Customer Name: ${customer}

🐟 Fish: ${fishName}

💰 Price: ₹${price}

🔢 Quantity: ${quantity}

💵 Total: ₹${price * quantity}

📍 Shipping: Telangana

Please confirm my order.`;

    let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

    window.open(url, "_blank");
}
</script>
