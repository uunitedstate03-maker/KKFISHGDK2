```html
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#d7f8ff,#e8f9ff,#b8ecff);
}

header{
background:#0077b6;
color:white;
padding:20px;
text-align:center;

border:none;
border-radius:30px;

}

.shipping{

color:white;
padding:12px;
text-align:center;

}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

}

.card{

.card:hover{

.card img{

}

.card h2{

}

.card h3{

}

button{

}

button:hover{
background:#128C7E;
}
